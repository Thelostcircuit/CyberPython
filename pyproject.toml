[project]
name = "cyberpython"
version = "1.0.0"
description = "CYBER//PYTHON: a story-driven cyberpunk Python course (standard library + the top 10 packages)"
readme = "README.md"
requires-python = ">=3.14"
# Part I and II are stdlib only. These are the "Cheese Shop" packages for Part III (ch 33-42).
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "flask>=3.0",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "pytest>=8.3",
]

[tool.uv]
package = false
